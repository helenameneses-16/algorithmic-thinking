<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de marca — Vyko</title>
<style>
  :root { --ink:#111111; --cream:#FFF8EC; --lime:#D4FF3D; --purple:#7B2FF7; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--cream); color:var(--ink); font-family: system-ui, sans-serif; padding:24px; }
  main { max-width:560px; text-align:center; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); line-height:1; margin:0 0 16px; text-transform:uppercase; }
  h1 span { background:var(--lime); padding:0 .15em; }
  p { font-size:1.1rem; line-height:1.5; }
  .tag { display:inline-block; background:var(--purple); color:var(--cream); border-radius:999px; padding:6px 14px; font-weight:700; margin-bottom:20px; }
</style>
</head>
<body>
<main>
  <div class="tag">En construcción</div>
  <h1>Diagnóstico <span>de marca</span></h1>
  <p>Una función nueva de Vyko: sube tu red social, cuéntanos qué personalidad quieres proyectar y te decimos si tu contenido llega a las personas correctas.</p>
</main>
</body>
</html>
